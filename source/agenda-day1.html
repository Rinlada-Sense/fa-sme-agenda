  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --r0:#0e9bd0; --r0b:#0a7fb8;
  --r1:#14b58a; --r1b:#0c9a74;
  --r2:#ff9b14; --r2b:#ff8200;
  --r3:#ff7ea0; --r3b:#ff6690;
  --blue:#4a76a3; --cyan:#2aa9d6; --ink:#1f2a37; --navy:#2d3a4a; --muted:#6b7a89;
  --line:#cfd8df; --ok:#14a36b; --bad:#e04a4a;
  --font:"Prompt","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --H:128px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  overflow-x:hidden;
  margin:0;font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh;
  background-color:#e3f4fa;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.bgwrap{position:fixed;inset:0;z-index:-1;background:#e3f4fa;pointer-events:none}
.bgwrap::after{content:"";position:absolute;inset:0;background-image:var(--bg-art);background-size:cover;background-position:center top;background-repeat:no-repeat}
.page{max-width:1320px;margin:0 auto;padding:22px max(20px,env(safe-area-inset-right,0px)) 56px max(20px,env(safe-area-inset-left,0px))}

/* ===== KV header ===== */
.logo{display:block}
.kv{--u:calc(min(100vw,1292px)/1292);--tfs:max(30px,calc(var(--u)*104));--sgap:calc(var(--u)*18);position:relative;display:flex;flex-direction:column;align-items:center;padding-top:60px;margin:0 0 22px;text-align:center}
.kvstack{display:flex;flex-direction:column;align-items:stretch;width:calc(var(--tfs)*8.111 + var(--sgap));max-width:100%;gap:calc(var(--u)*56)}
/* the lockup is exactly as wide as the AGENDA DAY title below it */
.kvtop{display:grid;grid-template-columns:minmax(0,312fr) minmax(0,48fr) minmax(2px,5fr) minmax(0,48fr) minmax(0,660fr);align-items:center;width:0;min-width:100%;text-align:left}
.kvlogo{grid-column:1;min-width:0}
.kvdiv{grid-column:3;align-self:stretch;min-height:0;background:#0a98d6}
.kvinfo{grid-column:5;width:100%;min-width:0;container-type:inline-size;display:flex;flex-direction:column;text-align:left}
/* sizes are fractions of this block's own width, so the text scales with the artwork */
.kvdate{margin:0;padding-left:5.9%;white-space:nowrap;font-weight:700;color:#0499d1;line-height:1.1;word-spacing:-.077em;
  font-size:clamp(10px,2.4vw,32px);font-size:7.879cqw}
.kvvenue{margin:.234cqw 0 0;padding-left:5.9%;white-space:nowrap;font-weight:500;color:#3f799e;line-height:1.15;
  font-size:clamp(9px,1.9vw,26px);font-size:6.288cqw}
.kvbarwrap{margin-top:.264cqw}
.kvinfoimg{display:block;width:100%;height:auto}
.titlebar{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
h1{margin:0;font-weight:600;font-size:calc(var(--tfs)*.6923);letter-spacing:.005em;color:var(--blue);line-height:1;display:flex;align-items:center;gap:calc(var(--sgap)*.6923)}
/* Day 1 and Day 2 must give the header the same width: the "1" is much narrower than the "2" in this font */
.dayno{display:inline-block;min-width:.583em;text-align:center}
h1 .star{width:.62em;height:auto;flex:none;align-self:flex-start;margin-top:-.02em;display:block}
.date{background:#fff;color:var(--cyan);font-weight:700;font-size:clamp(18px,2.4vw,26px);padding:6px 30px;border-radius:999px;border:2px solid #c6eaf5;box-shadow:0 6px 18px rgba(42,169,214,.18)}

.logo-img{display:block;width:100%;height:auto}
.bgsrc{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* ===== day tabs ===== */
.daytabs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:-4px 0 18px;position:sticky;top:env(safe-area-inset-top,0px);z-index:70;padding:10px 0}
/* a soft fade behind the sticky tabs, edge to edge, with no hard rectangle */
.daytabs::before{content:"";position:absolute;top:-22px;bottom:-30px;left:-40vw;right:-40vw;z-index:-1;pointer-events:none;
  /* frosted glass: blurred backdrop + a soft white tint with a faint sheen */
  background:linear-gradient(180deg,rgba(255,255,255,.46) 0%,rgba(236,248,253,.34) 55%,rgba(226,243,250,.22) 100%);

.intro h2 em{font-style:normal;color:inherit}
/* Thai has no spaces, so it needs a wider line to avoid a lone last word */
html[data-lang="th"] .intro p{max-width:68ch}
.intro p{margin:0 auto 18px;max-width:58ch;font-size:16px;line-height:1.55;color:#3b4b5c;text-wrap:pretty}
.steps{list-style:none;margin:0;padding:0;display:flex;justify-content:center;flex-wrap:wrap;gap:12px 40px}
.steps li{position:relative;display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);cursor:default;border-radius:999px;padding:6px 16px 6px 6px;font-size:15px;font-weight:600;color:var(--ink);box-shadow:none;animation:stepin .6s cubic-bezier(.16,1,.3,1) both}
.steps li:nth-child(2){animation-delay:.12s}
.steps li:nth-child(3){animation-delay:.24s}
@keyframes stepin{from{transform:translateY(10px)}}
/* dashed connector between steps */
.steps li+li::before{content:"";position:absolute;right:100%;top:50%;width:28px;margin-right:6px;border-top:2px dashed #a9cbe0}
.si{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;flex:none}
.si svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.si1{background:color-mix(in srgb,var(--r0) 16%,#fff);color:#0a6f9a}
.si2{background:color-mix(in srgb,var(--r1) 16%,#fff);color:#0b7a5c}
.si3{background:color-mix(in srgb,var(--r2) 18%,#fff);color:#a65800}
@media (max-width:860px){
  .intro{margin:0 auto 14px}
  .intro h2{font-size:20px;margin-bottom:8px}
  .intro p{display:none}
  .steps{flex-wrap:nowrap;gap:6px}
  .steps li{font-size:12px;padding:3px 10px 3px 3px;gap:6px;white-space:nowrap}
  .steps li+li::before{display:none}
  .si{width:24px;height:24px}
  .si svg{width:14px;height:14px}
}
@media (min-width:861px) and (max-height:820px){
  .intro{margin-bottom:16px}
  .intro h2{font-size:26px}
  .intro p{display:none}
}
/* ===== first-time guidance ===== */
/* 1. the highlighted empty slot points at where sessions come from */
body:not(.dragging-now) .cell.sel::after{content:"← Drag a session from the list"}
html[data-lang="th"] body:not(.dragging-now) .cell.sel::after{content:"← ลากหัวข้อจากรายการมาวางที่นี่"}
/* 2. the how-to line in the session list reads as an instruction, not a footnote */
#slotMeta{color:var(--blue);font-weight:600}
/* 3. clicking an empty slot visibly refreshes the session list */
.list{border-radius:16px}
.tray.flash .list{animation:trayflash .7s ease-out}
@keyframes trayflash{0%{background:#dff1fa}100%{background:transparent}}
/* 4. first visit only: the first card nudges with a label, until the first drop */
.list:has(.nudge),.tray .list:has(.nudge){padding-top:16px}
.tcard.nudge{animation:nudge 1.8s ease-in-out .5s 3}
@keyframes nudge{0%,50%,100%{transform:none}20%{transform:translateX(10px)}35%{transform:translateX(2px)}}
@keyframes nudgeup{0%,50%,100%{transform:none}20%{transform:translateY(-8px)}35%{transform:translateY(-2px)}}
.tcard.nudge::after{content:attr(data-nudge);position:absolute;top:-12px;right:10px;background:var(--blue);color:#fff;font-size:11.5px;font-weight:600;line-height:1;padding:5px 10px;border-radius:999px;box-shadow:0 4px 10px rgba(40,100,140,.25);pointer-events:none;white-space:nowrap}
@media (max-width:860px){
  body:not(.dragging-now) .cell.sel::after{content:"↓ Hold a card below, then drag it here"}
  html[data-lang="th"] body:not(.dragging-now) .cell.sel::after{content:"↓ กดค้างที่การ์ดด้านล่าง แล้วลากมาวางที่นี่"}
  .tcard.nudge{animation-name:nudgeup}
}
/* direction-aware slot text: the list is beside the board from 1181px, above it 861-1180px, below it on phones */
@media (min-width:861px) and (max-width:1180px){
  body:not(.dragging-now) .cell.sel::after{content:"↑ Drag a session from the list above"}
  html[data-lang="th"] body:not(.dragging-now) .cell.sel::after{content:"↑ ลากหัวข้อจากรายการด้านบนมาวางที่นี่"}
  html.touch body:not(.dragging-now) .cell.sel::after{content:"↑ Hold a session above, then drag it here"}
  html.touch[data-lang="th"] body:not(.dragging-now) .cell.sel::after{content:"↑ กดค้างที่หัวข้อด้านบน แล้วลากมาวางที่นี่"}
}
@media (min-width:1181px){
  html.touch body:not(.dragging-now) .cell.sel::after{content:"← Hold a session in the list, then drag it here"}
  html.touch[data-lang="th"] body:not(.dragging-now) .cell.sel::after{content:"← กดค้างที่หัวข้อในรายการ แล้วลากมาวางที่นี่"}
}
@media (max-width:860px){
  html.touch body:not(.dragging-now) .cell.sel::after{content:"↓ Hold a card below, then drag it here"}
  html.touch[data-lang="th"] body:not(.dragging-now) .cell.sel::after{content:"↓ กดค้างที่การ์ดด้านล่าง แล้วลากมาวางที่นี่"}
}
/* touch: the card answers the press before the 240ms hold starts the drag */
.card.pressing{transform:scale(.97);transition:transform .2s cubic-bezier(.16,1,.3,1)}
/* ===== desktop refinements (phones keep their own rules above) ===== */
@media (min-width:861px){
  :root{--muted:#5e6c7a}
  .tcard{padding:12px 13px;gap:8px}
  .tcard .ttl{font-size:14px;line-height:1.35}
  .tag,.lvl{font-size:11.5px}
  .tag{padding:5px 10px}
  .lvl{padding:4px 11px}
  .tcard .meta{font-size:12px}
  .slotlabel span{font-size:12.5px}
  .progtxt.full{color:#17603c;font-weight:600}
  .tm.sel{color:#1679a8}
  .slotnav .nav:hover:not(:disabled){color:#1679a8}
  .cell::after{opacity:1}
  .tbtn.tmain{background:linear-gradient(90deg,#1679a8,var(--blue))}
  /* Room 3: deeper orange for orange text (pill text stays white, user choice) */
  .card.r2 .rm,.card.r2 .meta .when{color:#a65800}
}
@media (min-width:1181px){
  .layout{grid-template-columns:340px 1fr}
  /* clear the sticky day tabs (about 68px tall) */
  .tray{top:calc(env(safe-area-inset-top,0px) + 84px)}
}
/* ===== touch screens of any width use the hold-and-drag engine ===== */
html.touch body:not(.dragging-now) .cell::after{content:"Hold a card, then drag it here"}
html.touch[data-lang="th"] body:not(.dragging-now) .cell::after{content:"กดค้างที่การ์ด แล้วลากมาวางที่นี่"}
html.touch .tcard,html.touch .placed{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html.touch.dragging-now .tcard,html.touch.dragging-now .placed{touch-action:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
  function hexA(h,a){var c=hexRGB(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
  function mix(h,t){var c=hexRGB(h).map(function(v){return Math.round(v+(255-v)*t)});return 'rgb('+c.join(',')+')'}
  function rr(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath()}
  function tokens(t){
    try{if(Intl.Segmenter){var sg=new Intl.Segmenter('th',{granularity:'word'});return Array.from(sg.segment(t),function(p){return p.segment})}}catch(e){}
    return t.split(/(\s+)/);
  }
  function wrap(x,text,maxW,maxLines){
    var tk=[];
    tokens(text).forEach(function(t){
      if(x.measureText(t).width<=maxW){tk.push(t);return}
      Array.from(t).forEach(function(ch){tk.push(ch)});
    });
    var lines=[],cur='';
    tk.forEach(function(t){
      var test=cur+t;
      if(!cur||x.measureText(test).width<=maxW){cur=test}
      else{lines.push(cur.replace(/\s+$/,''));cur=t.replace(/^\s+/,'')}
    });
    if(cur) lines.push(cur);
    if(lines.length>maxLines){
      lines=lines.slice(0,maxLines);var l=lines[maxLines-1];
      while(l.length&&x.measureText(l+'…').width>maxW) l=l.slice(0,-1);
      lines[maxLines-1]=l+'…';
    }
    return lines;
  }

  function drawImage(ds){
    ds=(ds&&ds.length)?ds:[day];
    var FAM='Prompt,"Noto Sans Thai",system-ui,sans-serif';
    var NAVY='#2d3a4a',BLUE='#4a76a3',MUTED='#6b7a89',INK='#1f2a37';
    var W=1040,PAD=34,PW=W-PAD*2,IN=34,TW=122,GAP=28,CW=PW-IN*2-TW-GAP,RG=20;
    var multi=ds.length>1,CAP=0,DGAP=0;

    // ---- measure first, so the image is exactly as tall as it needs to be ----
    var m=document.createElement('canvas').getContext('2d');
    var days=[],picked=0;
    ds.forEach(function(d){
      var map=PLAN[d],rows=[],s=0;
      function own(sl){for(var id in map){var z=byId(id);if(sl>=map[id]&&sl<map[id]+z.span)return z}return null}
      while(s<5){
        if(s===2) rows.push({type:'lunch',h:74});
        var o=own(s);
        if(o&&map[o.id]===s){
          m.font='500 21px '+FAM;
          var lines=wrap(m,sTitle(o),CW-64,o.span===2?5:3);
          var h=24+27+16+lines.length*30+20+o.sp*46+22;
          rows.push({type:'s',sess:o,lines:lines,slot:s,h:Math.max(h,166)});
          picked+=o.span;s+=o.span;
        }else{rows.push({type:'free',slot:s,h:84});s+=1}
      }
      var ph=IN*2;rows.forEach(function(r,i){ph+=r.h+(i?RG:0)});
      days.push({d:d,rows:rows,h:ph});
    });
    // ---- header geometry: the same proportions as the landing page ----
    var TFS=104;                                        // title font size; everything else scales from the title width
    var titleBase=T('imgTitle')(1).replace(/\d+$/,'');   // "AGENDA DAY "
    m.font='600 '+TFS+'px '+FAM;
    var starW=TFS*.62,starGap=18,slotW=.583*TFS;
    var Lw=starW+starGap+m.measureText(titleBase).width+slotW;   // the lockup is as wide as the single-day title row, for every download
    var elLogo=document.getElementById('logoImg'),elBar=document.getElementById('barImg'),elStar=document.getElementById('starImg');
    var logoW=Lw*312/1073,gapX=Lw*48/1073,divW=Math.max(2,Lw*5/1073),infoW=Lw*660/1073;
    var logoH=logoW*((elLogo&&elLogo.naturalHeight)?elLogo.naturalHeight/elLogo.naturalWidth:511/520);
    var fsd=infoW*.07879,fsv=infoW*.06288,padL=infoW*.059;
    var dBox=1.1*fsd,vBox=1.15*fsv,vMarg=infoW*.00234,barMarg=infoW*.00264,barH=infoW*359/1320;
    var infoH=dBox+vMarg+vBox+barMarg+barH,Hh=Math.max(logoH,infoH);
    var TOPPAD=48,TGAP=56,BOTPAD=52;
    var LFS=72;                                          // font size of the day labels in the combined image
    var FOOT=56,HDR=TOPPAD+Hh+TGAP+(multi?0:LFS+BOTPAD);
    if(multi){CAP=LFS+BOTPAD;DGAP=TGAP}                  // same space above every title: under the lockup and under each panel
    var H=HDR+FOOT;
    days.forEach(function(g,i){H+=CAP+g.h+(i?DGAP:0)});

    var S2=2,cv=document.createElement('canvas');cv.width=W*S2;cv.height=H*S2;
    var x=cv.getContext('2d');x.scale(S2,S2);x.textBaseline='middle';

    // ---- background: the event artwork, cropped to fill ----
    x.fillStyle='#e3f4fa';x.fillRect(0,0,W,H);
    var bgi=document.getElementById('bgImg');
    if(bgi&&bgi.complete&&bgi.naturalWidth){
      var sc=Math.max(W/bgi.naturalWidth,H/bgi.naturalHeight);
      var dw=bgi.naturalWidth*sc,dh=bgi.naturalHeight*sc;
      x.drawImage(bgi,(W-dw)/2,0,dw,dh);
    }

    // ---- header: logo | divider | date, venue, tagline bar, then the star and title ----
    x.imageSmoothingQuality='high';x.textBaseline='alphabetic';x.textAlign='left';
    var Lx=(W-Lw)/2,lockTop=TOPPAD;
    if(elLogo&&elLogo.complete&&elLogo.naturalWidth) x.drawImage(elLogo,Lx,lockTop+(Hh-logoH)/2,logoW,logoH);
    x.fillStyle='#0a98d6';x.fillRect(Lx+logoW+gapX,lockTop,divW,Hh);
    var ix=Lx+logoW+2*gapX+divW,iy=lockTop+(Hh-infoH)/2;
    function drawWords(txt,px,by,fs,adj){
      var sp=x.measureText(' ').width+adj*fs,cx=px;
      txt.split(' ').forEach(function(w){x.fillText(w,cx,by);cx+=x.measureText(w).width+sp});
    }
    var A=1.09,D=.422;                                   // the font's ascent and descent, to place baselines like CSS line boxes
    x.fillStyle='#0499d1';x.font='700 '+fsd+'px '+FAM;
    drawWords('18 - 19 DECEMBER 2026',ix+padL,iy+((1.1-(A+D))/2+A)*fsd,fsd,-.077);
    var vTop=iy+dBox+vMarg;
    x.fillStyle='#3f799e';x.font='500 '+fsv+'px '+FAM;
    x.fillText('Sasin School of Management',ix+padL,vTop+((1.15-(A+D))/2+A)*fsv);
    if(elBar&&elBar.complete&&elBar.naturalWidth) x.drawImage(elBar,ix,vTop+vBox+barMarg,infoW,barH);
    function titleRow(topY,n,fs){
      var k=fs/TFS,sw=starW*k,sg=starGap*k,slot=slotW*k;
      x.textBaseline='alphabetic';x.textAlign='left';
      x.fillStyle=BLUE;x.font='600 '+fs+'px '+FAM;
      var tw=x.measureText(titleBase).width,gx=Lx+(Lw-(sw+sg+tw+slot))/2;   // centred; fills the lockup width at the full title size
      if(elStar&&elStar.complete&&elStar.naturalWidth) x.drawImage(elStar,gx,topY-.02*fs,sw,sw*elStar.naturalHeight/elStar.naturalWidth);
      var base=topY+((1-(A+D))/2+A)*fs,tx=gx+sw+sg;
      x.fillText(titleBase,tx,base);
      x.textAlign='center';                              // the day number is centred in a fixed-width slot, as on the page
      x.fillText(String(n),tx+tw+slot/2,base);
      x.textAlign='left';x.textBaseline='middle';
    }
    if(!multi) titleRow(lockTop+Hh+TGAP,ds[0],LFS);
    x.textBaseline='middle';

    // ---- a panel per day ----
    var cx=PAD+IN+TW+GAP,top=HDR;
    x.font='600 25px '+FAM;
    var tbw=0;SLOTTXT.forEach(function(t){var q=t.split(' – ');tbw=Math.max(tbw,x.measureText(q[0]+' -').width,x.measureText(q[1]).width)});
    var tLeft=PAD+IN+(TW-tbw)/2;                         // left edge of the time block
    days.forEach(function(g,gi){
    var rows=g.rows;
    if(gi) top+=DGAP;
    if(multi){
      titleRow(top,g.d,LFS);
      top+=CAP;
    }
    x.save();x.shadowColor='rgba(40,100,140,.18)';x.shadowBlur=36;x.shadowOffsetY=14;
    rr(x,PAD,top,PW,g.h,38);x.fillStyle='#fff';x.fill();x.restore();

    var y=top+IN;
    rows.forEach(function(r,ri){
      if(ri&&r.type!=='lunch'&&rows[ri-1].type!=='lunch'){
        x.setLineDash([3,7]);x.lineWidth=2;x.strokeStyle='#d3dde4';
        x.beginPath();x.moveTo(PAD+IN,y-RG/2);x.lineTo(PAD+PW-IN,y-RG/2);x.stroke();x.setLineDash([]);
      }
      if(r.type==='lunch'){
        rr(x,PAD+IN,y,PW-IN*2,r.h,18);x.fillStyle='#ededed';x.fill();
        x.fillStyle='#4b5560';x.font='600 22px '+FAM;x.textAlign='center';
        x.fillText(T('lunch'),W/2,y+r.h/2+1);
        y+=r.h+RG;return;
      }
      // time column
      var end=SLOTTXT[r.slot+(r.type==='s'?r.sess.span-1:0)].split(' – ')[1];
      var tcy=y+r.h/2;
      x.textAlign='left';x.fillStyle=BLUE;x.font='600 25px '+FAM;
      x.fillText(SLOTTXT[r.slot].split(' – ')[0]+' -',tLeft,tcy-18);
      x.fillText(end,tLeft,tcy+18);

      if(r.type==='free'){
        rr(x,cx,y,CW,r.h,20);x.fillStyle='#fbfdfe';x.fill();
        x.setLineDash([7,7]);x.lineWidth=2;x.strokeStyle='#dde6ec';x.stroke();x.setLineDash([]);
        x.fillStyle='#9bacb9';x.font='500 17px '+FAM;x.textAlign='center';
        x.fillText(T('noPick'),cx+CW/2,y+r.h/2);
        y+=r.h+RG;return;
      }

      // session card
      var ss=r.sess,col=RCOL[ss.room],p=28;
      x.save();x.shadowColor='rgba(40,100,140,.13)';x.shadowBlur=14;x.shadowOffsetY=5;
      rr(x,cx,y,CW,r.h,20);x.fillStyle='#fff';x.fill();x.restore();
      rr(x,cx,y,CW,r.h,20);x.save();x.clip();
      x.fillStyle=hexA(col,.08);x.fillRect(cx,y,CW,r.h);x.restore();
      rr(x,cx,y,CW,r.h,20);x.strokeStyle=col;x.lineWidth=2.5;x.stroke();

      var ix=cx+p;
      // tag + level
      x.font='600 14px '+FAM;x.textAlign='left';
      var tgW=x.measureText(ss.tag).width+26;
      rr(x,ix,y+24,tgW,27,13.5);x.fillStyle=col;x.fill();
      x.fillStyle='#fff';x.fillText(ss.tag,ix+13,y+38);
      var lvW=x.measureText(T('levels')[ss.lvl]||ss.lvl).width+28,lx=cx+CW-p-lvW;
      rr(x,lx,y+25,lvW,25,12.5);
      if(ss.lvl==='Basic'){x.fillStyle='#fff';x.fill();x.strokeStyle=NAVY;x.lineWidth=2;x.stroke();x.fillStyle=NAVY}
      else{x.fillStyle=NAVY;x.fill();x.fillStyle='#fff'}
      x.fillText(T('levels')[ss.lvl]||ss.lvl,lx+14,y+38);
      // title
      x.fillStyle=INK;x.font='500 21px '+FAM;
      var ty2=y+24+27+16;
      r.lines.forEach(function(l,i){x.fillText(l,ix,ty2+i*30+15)});
      // speakers + room
      var sy=ty2+r.lines.length*30+20;
      for(var k=0;k<ss.sp;k++){
        var ay=sy+k*46,acx=ix+19,acy=ay+20;
        var ag=x.createLinearGradient(acx-19,acy-19,acx+19,acy+19);ag.addColorStop(0,col);ag.addColorStop(1,mix(col,.35));
        x.beginPath();x.arc(acx,acy,19,0,Math.PI*2);x.fillStyle=ag;x.fill();
        x.save();x.beginPath();x.arc(acx,acy,19,0,Math.PI*2);x.clip();
        x.fillStyle='#fff';x.beginPath();x.arc(acx,acy-4,6.6,0,Math.PI*2);x.fill();
        x.beginPath();x.arc(acx,acy+18,14,Math.PI,0);x.fill();x.restore();
        x.textAlign='left';x.fillStyle=INK;x.font='600 15px '+FAM;x.fillText(T('speaker'),ix+48,ay+13);
        x.fillStyle=MUTED;x.font='400 13px '+FAM;x.fillText(T('role'),ix+48,ay+32);
      }
      x.textAlign='right';x.fillStyle=col;x.font='600 16px '+FAM;
      x.fillText(ROOMS[ss.room],cx+CW-p,sy+18);
      y+=r.h+RG;
    });
    top+=g.h;
    });

    // (footer line removed for now)
    return cv;
  }

  // ---------- add to calendar (.ics) ----------
  var SLOT_TIMES=[[9,0,10,30],[10,45,12,15],[13,0,14,30],[14,45,16,15],[16,30,18,0]];
  var DAY_YMD={1:[2026,12,18],2:[2026,12,19]};
  function icsPad(n){return (n<10?'0':'')+n}
  function icsStamp(y,mo,d,h,mi){
    // Bangkok local time (UTC+7) converted to a UTC timestamp for the .ics file
    var dt=new Date(Date.UTC(y,mo-1,d,h-7,mi,0));
    return dt.getUTCFullYear()+icsPad(dt.getUTCMonth()+1)+icsPad(dt.getUTCDate())+'T'+icsPad(dt.getUTCHours())+icsPad(dt.getUTCMinutes())+'00Z';
  }
  function icsEscape(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
  function icsFold(line){
    // RFC 5545: lines over 75 octets are folded with a leading space
    var out='',i=0;
    while(line.length-i>74){out+=line.slice(i,i+74)+'\r\n ';i+=74}
    return out+line.slice(i);
  }
  function buildIcs(ds){
    var now=icsStamp(new Date().getUTCFullYear(),new Date().getUTCMonth()+1,new Date().getUTCDate(),new Date().getUTCHours()+7,new Date().getUTCMinutes());
    var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SME How to Scale Expo 2026//Agenda//EN','CALSCALE:GREGORIAN'];
    var n=0;
    ds.forEach(function(d){
      var ymd=DAY_YMD[d],ids=Object.keys(PLAN[d]).sort(function(a,b){return PLAN[d][a]-PLAN[d][b]});
      ids.forEach(function(id){
        var s=byId(id),start=PLAN[d][id];
        var t1=SLOT_TIMES[start],t2=SLOT_TIMES[start+s.span-1];
        var dtStart=icsStamp(ymd[0],ymd[1],ymd[2],t1[0],t1[1]);
        var dtEnd=icsStamp(ymd[0],ymd[1],ymd[2],t2[2],t2[3]);
        n++;
        lines.push('BEGIN:VEVENT');
        lines.push('UID:'+id+'-day'+d+'-sme2026@flowaccount.com');
        lines.push('DTSTAMP:'+now);
        lines.push(icsFold('DTSTART:'+dtStart));
        lines.push(icsFold('DTEND:'+dtEnd));
        lines.push(icsFold('SUMMARY:'+icsEscape(sTitle(s))));
        lines.push(icsFold('DESCRIPTION:'+icsEscape(s.tag+' · '+s.lvl+' · '+ROOMS[s.room])));
        lines.push(icsFold('LOCATION:'+icsEscape(ROOMS[s.room]+', '+T('venue'))));
        lines.push('END:VEVENT');
      });
    });
    lines.push('END:VCALENDAR');
    return {text:lines.join('\r\n'),count:n};
  }
  function downloadIcs(ds){
    var built=buildIcs(ds),name=ds.length>1?'my-agenda-day1-and-2.ics':'my-agenda-day'+ds[0]+'.ics';
    if(!built.count){toast(T('addFirst'));return}
    var blob=new Blob([built.text],{type:'text/calendar;charset=utf-8'});
    if(dl){
      dl.save({filename:name,data:blob}).then(function(){toast(T('icsSaved'))},function(e){if(e&&e.code==='declined')return;toast(T('icsFail'))});
    }else{
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(a.href)},4000);toast(T('icsDl'));
    }
  }

  document.querySelector('.daytabs').addEventListener('keydown',function(e){
    var k=e.key,d=k==='ArrowLeft'||k==='Home'?1:(k==='ArrowRight'||k==='End'?2:0);
    if(!d)return;e.preventDefault();
    if(d!==day)setDay(d);
    document.querySelector('.daytabs button[data-day="'+d+'"]').focus();
  });
  applyLang();
})();
</script>
</body>
</html>
